name: Deploy to GitHub Pages

on:
  # 站点由 GitHub 内置「Deploy from a branch (master)」构建服务，此工作流仅保留 workflow_dispatch 手动备用，
  # 不再随 push 触发，避免与内置构建并发竞争导致随机失败。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          # 网页页面（index=React 落地页；main=实验手册；assistant=AI助手；knowledge=知识图谱；prep=课前预习；corpus=语料库）
          cp index.html main.html assistant.html knowledge.html prep.html corpus.html generator.html _site/
          # 资源：React bundle / CSS / KaTeX 字体 / vendor(pdf.js) / 实验图片
          cp -r assets _site/
          # 本机脚本（assistant.html 通过 <script src="scripts/lib-calc.js"> 加载通用计算引擎）
          mkdir -p _site/scripts
          cp scripts/lib-calc.js _site/scripts/
          # 仅运行时需要的 data（其余 dev 产物如 kb/lexicon/questions_master 不部署）
          mkdir -p _site/data
          cp data/manual.json data/corpus.json data/images.json data/faq_runtime.js _site/data/
          cp data/kg.json data/questions_bank.json data/report_rubric.json data/faq_unified.json _site/data/
          cp data/categories.json data/corpus_weights.json _site/data/
          cp CNAME _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
