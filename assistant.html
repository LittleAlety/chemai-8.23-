<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://api.deepseek.com">
<link rel="preload" href="data/faq_unified.json" as="fetch" crossorigin="anonymous">
<link rel="preload" href="data/corpus.json" as="fetch" crossorigin="anonymous">
<title>AI 鍔╂墜 路 ChemAI 涓夎崏閰稿悎閾侀吀閽惧埗澶囧疄楠?/title>
<style>
:root{
  --bg:#0a0e1a; --bg2:#111827; --card:#1a2235; --hover:#243049;
  --em:#10b981; --teal:#2dd4bf; --purple:#a78bfa; --yellow:#fbbf24; --red:#f87171; --blue:#60a5fa;
  --t1:#f1f5f9; --t2:#94a3b8; --t3:#64748b;
  --bd:rgba(148,163,184,.08); --bd2:rgba(148,163,184,.15);
  --grad:linear-gradient(135deg,#10b981,#2dd4bf,#60a5fa);
  --shadow:0 8px 28px rgba(2,6,23,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--t1); min-height:100vh;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.7;
  background-image:radial-gradient(900px 420px at 85% -10%,rgba(16,185,129,.08),transparent 60%),
                   radial-gradient(760px 420px at -10% 30%,rgba(96,165,250,.06),transparent 60%);
}
a{color:var(--teal);text-decoration:none}
a:hover{color:var(--em)}
::selection{background:rgba(16,185,129,.35)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#243049;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ===== 椤堕儴瀵艰埅 ===== */
.topbar{position:sticky;top:0;z-index:60;background:rgba(10,14,26,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand-ic{width:38px;height:38px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 14px rgba(16,185,129,.35)}
.brand-tx{display:flex;flex-direction:column;line-height:1.25}
.brand-tx b{font-size:17px;color:var(--t1);letter-spacing:.4px}
.brand-tx i{font-style:normal;font-size:11px;color:var(--t3)}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{position:relative;padding:8px 13px;font-size:13.5px;color:var(--t2);border-radius:9px;transition:.2s}
.nav a:hover{color:var(--t1);background:var(--hover)}
.nav a.on{color:var(--em)}
.nav a.on::after{content:"";position:absolute;left:13px;right:13px;bottom:2px;height:2px;border-radius:2px;background:var(--em)}
.nav-toggle{display:none;margin-left:auto;background:var(--card);border:1px solid var(--bd2);color:var(--t1);border-radius:9px;padding:7px 12px;font-size:16px;cursor:pointer}
@media (max-width:960px){
  .nav{display:none;position:absolute;top:62px;left:0;right:0;background:var(--bg2);border-bottom:1px solid var(--bd2);flex-direction:column;align-items:stretch;padding:10px 16px;gap:2px}
  .nav.open{display:flex}
  .nav a{padding:11px 13px}
  .nav-toggle{display:block}
}

/* ===== 甯冨眬 ===== */
.wrap{max-width:1360px;margin:0 auto;padding:26px 20px 60px}
.page-head{margin-bottom:20px;animation:fadeUp .5s ease both}
.page-head h1{font-size:26px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
.page-head .sub{color:var(--t2);font-size:13.5px;margin-top:4px}
.stat-cards{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.stat-card{flex:1;min-width:120px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;transition:.2s;box-shadow:var(--shadow)}
.stat-card:hover{border-color:rgba(16,185,129,.3);transform:translateY(-1px)}
.stat-icon{font-size:28px;flex-shrink:0}
.stat-info{display:flex;flex-direction:column}
.stat-num{font-size:22px;font-weight:700;color:var(--t1);line-height:1.2}
.stat-label{font-size:11px;color:var(--t3)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
@media (max-width:1080px){.grid{grid-template-columns:1fr}}

/* ===== Tab ===== */
.tabs{display:flex;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px;margin-bottom:16px;box-shadow:var(--shadow)}
.tab{flex:1;border:1px solid transparent;background:transparent;color:var(--t2);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:15px;font-weight:600;text-align:left;transition:.22s;display:flex;flex-direction:column;gap:2px;font-family:inherit}
.tab span{font-size:11.5px;font-weight:400;color:var(--t3)}
.tab:hover{background:var(--hover);color:var(--t1)}
.tab.on{background:linear-gradient(135deg,rgba(16,185,129,.16),rgba(45,212,191,.1),rgba(96,165,250,.1));border-color:rgba(16,185,129,.4);color:var(--em)}
.tab.on span{color:rgba(16,185,129,.75)}

/* ===== 闈㈡澘涓庤亰澶?===== */
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;animation:fadeUp .45s ease both}
.hidden{display:none!important}
.panel-bar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.corpus-status{font-size:12.5px;color:var(--t3);display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.corpus-status .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);flex-shrink:0}
.corpus-status.ok .dot{background:var(--em);box-shadow:0 0 8px rgba(16,185,129,.7)}
.corpus-status.bad .dot{background:var(--red)}
.chat{padding:20px 18px 10px;overflow-y:auto;min-height:400px;max-height:min(640px,calc(100vh - 360px));scroll-behavior:smooth}
.msg{display:flex;gap:11px;margin-bottom:18px;animation:fadeUp .35s ease both}
.msg .avatar{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px}
.msg.ai .avatar{background:linear-gradient(135deg,rgba(16,185,129,.25),rgba(96,165,250,.25));border:1px solid rgba(16,185,129,.35)}
.msg.user{flex-direction:row-reverse}
.msg.user .avatar{background:var(--hover);border:1px solid var(--bd2)}
.bubble{max-width:min(86%,720px);padding:12px 15px;border-radius:14px;font-size:14px;word-break:break-word}
.msg.ai .bubble{background:var(--bg2);border:1px solid var(--bd);border-top-left-radius:4px}
.msg.user .bubble{background:linear-gradient(135deg,rgba(16,185,129,.85),rgba(45,212,191,.75));color:#04121b;font-weight:500;border-top-right-radius:4px}
.bubble h4{font-size:14px;color:var(--teal);margin:10px 0 6px}
.bubble h4:first-child{margin-top:0}
.bubble p{margin:6px 0}
.bubble ul,.bubble ol{margin:6px 0 6px 20px}
.bubble li{margin:3px 0}
.bubble .muted{color:var(--t3);font-size:12px}
.bubble code{background:rgba(96,165,250,.12);color:var(--blue);padding:1px 6px;border-radius:6px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace}
.divider{border:none;border-top:1px dashed var(--bd2);margin:12px 0}
.ans-sec{margin:8px 0}
.ans-sec+.ans-sec{border-top:1px dashed var(--bd);padding-top:8px}
.faq-chip{font-family:inherit}

/* 瀵屾枃鏈瓟妗堟覆鏌?*/
.rich-answer p{margin:9px 0}
.rich-answer ul,.rich-answer ol{margin:8px 0 8px 20px}
.ans-line{display:block;overflow-wrap:anywhere;word-break:break-word;white-space:normal;line-height:1.85}
.ans-head{display:block;font-weight:700;margin:10px 0 4px;color:var(--teal);overflow-wrap:anywhere;line-height:1.7}
.ans-eq{display:block;overflow-wrap:anywhere;word-break:break-word;white-space:normal;line-height:1.9;font-family:ui-monospace,Consolas,monospace}
.ans-eq-block{display:block;margin:6px 0;padding:8px 14px;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:.92em;line-height:2.1;background:rgba(0,0,0,.22);border-radius:10px;border-left:2px solid var(--em);overflow-x:auto;white-space:pre}
.ans-inline-math{font-family:"Cambria Math","Latin Modern Math",ui-monospace,serif;font-style:italic;color:var(--teal)}
.ans-sub{font-size:.82em;vertical-align:sub;line-height:0}
.ans-sup{font-size:.82em;vertical-align:super;line-height:0}

/* 妫€绱㈡祦姘寸嚎 */
.pipe{display:flex;flex-direction:column;gap:0;margin:2px 0 4px}
.pipe-step{display:flex;align-items:center;gap:10px;padding:5px 0;color:var(--t3);font-size:13px;transition:.25s}
.pipe-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;transition:.25s;background:var(--card)}
.pipe-step.active{color:var(--t1)}
.pipe-step.active .pipe-dot{border-color:var(--em);animation:pulse 1s infinite}
.pipe-step.done{color:var(--t2)}
.pipe-step.done .pipe-dot{border-color:var(--teal);background:rgba(45,212,191,.15);color:var(--teal)}
.pipe-meta{font-size:12px;color:var(--t3);margin:6px 0 2px;padding-left:32px}
.pipe-meta b{color:var(--em)}

/* ===== 鏅鸿兘浣撻泦缇?缃俊搴?+ 鑷煡 ===== */
.confidence-bar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:11px}
.confidence-bar .cf-label{min-width:90px;color:var(--t2);white-space:nowrap}
.confidence-bar .cf-track{flex:1;height:5px;border-radius:5px;background:var(--hover);overflow:hidden}
.confidence-bar .cf-fill{display:block;height:100%;border-radius:5px;transition:width .6s ease}
.cf-high .cf-fill{background:linear-gradient(90deg,var(--em),var(--teal))}
.cf-med .cf-fill{background:linear-gradient(90deg,var(--yellow),var(--em))}
.cf-low .cf-fill{background:linear-gradient(90deg,var(--red),var(--yellow))}
.confidence-bar .cf-pct{width:32px;text-align:right;color:var(--t2);font-family:ui-monospace,monospace}
.selfcheck-warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:12px;color:var(--t2)}
.selfcheck-warn::before{content:"鈿?";font-size:13px}
.selfcheck-ok{font-size:11px;color:var(--teal);display:flex;align-items:center;gap:4px}
.selfcheck-ok::before{content:"鉁?;font-weight:700;font-size:13px}
.analogy-banner{background:rgba(167,139,250,.06);border:1px solid rgba(167,139,250,.25);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:12px}
.analogy-banner .bridge-icon{display:inline-block;margin-right:4px;font-size:14px}
.source-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600}
.source-tag.faq{background:rgba(16,185,129,.15);color:var(--em);border:1px solid rgba(16,185,129,.3)}
.source-tag.corpus{background:rgba(96,165,250,.15);color:var(--blue);border:1px solid rgba(96,165,250,.3)}
.source-tag.analogy{background:rgba(167,139,250,.15);color:var(--purple);border:1px solid rgba(167,139,250,.3)}
.ref-toggle{background:var(--card);border:1px solid var(--bd2);border-radius:8px;color:var(--t2);font-size:12px;padding:4px 10px;cursor:pointer;font-family:inherit;transition:.18s}
.ref-toggle:hover{color:var(--em);border-color:rgba(16,185,129,.45)}

/* 鏂囩尞鍗＄墖 */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
.doc-card{background:var(--card);border:1px solid var(--bd2);border-radius:12px;padding:11px 13px;transition:.2s;display:block}
.doc-card:hover{border-color:rgba(16,185,129,.45);background:var(--hover);transform:translateY(-2px)}
.doc-card .dc-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.doc-card .dc-id{font-size:11px;color:var(--em);background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);padding:0 7px;border-radius:20px;white-space:nowrap}
.doc-card .dc-sub{font-size:11px;color:var(--purple);background:rgba(167,139,250,.1);padding:0 7px;border-radius:20px;white-space:nowrap}
.doc-card .dc-up{font-size:11px;color:var(--yellow);background:rgba(251,191,36,.1);padding:0 7px;border-radius:20px;white-space:nowrap}
.doc-card .dc-title{font-size:13px;color:var(--t1);font-weight:600;line-height:1.45;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc-card .dc-row{font-size:11.5px;color:var(--t3);line-height:1.55}
.doc-card .dc-row b{color:var(--t2);font-weight:500}
.doc-card .dc-q{font-size:11.5px;color:var(--teal);margin-top:4px}
.doc-card .dc-path{font-size:10.5px;color:var(--t3);margin-top:5px;word-break:break-all;font-family:ui-monospace,Consolas,monospace;opacity:.75}
.score-bar{height:4px;border-radius:4px;background:var(--hover);margin-top:7px;overflow:hidden}
.score-bar i{display:block;height:100%;background:var(--grad);border-radius:4px}

/* 鑱斿姩鍗＄墖 */
.link-card{border:1px solid var(--bd2);border-radius:12px;padding:11px 13px;margin-top:10px;background:linear-gradient(135deg,rgba(16,185,129,.06),rgba(96,165,250,.05))}
.link-card.warn{border-color:rgba(251,191,36,.35);background:linear-gradient(135deg,rgba(251,191,36,.07),rgba(248,113,113,.05))}
.link-card.safe{border-color:rgba(248,113,113,.3);background:linear-gradient(135deg,rgba(248,113,113,.06),rgba(251,191,36,.04))}
.link-card.video{border-color:rgba(96,165,250,.3);background:linear-gradient(135deg,rgba(96,165,250,.07),rgba(167,139,250,.05))}
.link-card h4{margin:0 0 8px!important;font-size:13.5px!important}
.link-card .lk{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd2);border-radius:9px;padding:6px 11px;font-size:12.5px;color:var(--t1);margin:3px 6px 3px 0;transition:.18s}
.link-card .lk:hover{border-color:var(--em);color:var(--em);transform:translateY(-1px)}
.link-card .lk small{color:var(--t3)}
.chem-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 0;border-top:1px dashed var(--bd)}
.chem-row:first-of-type{border-top:none}
.chem-row .cn{font-size:13px;font-weight:600;color:var(--yellow);min-width:130px}

/* chips / 蹇嵎 */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 10px}
.chip{font-size:12px;color:var(--t2);background:var(--bg2);border:1px solid var(--bd2);border-radius:20px;padding:5px 12px;cursor:pointer;transition:.18s}
.chip:hover{color:var(--em);border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.08)}
.composer{display:flex;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--bd);background:var(--bg2);align-items:flex-end}
.composer textarea{flex:1;resize:none;background:var(--card);border:1px solid var(--bd2);border-radius:12px;color:var(--t1);padding:11px 14px;font-size:14px;font-family:inherit;line-height:1.55;max-height:130px;outline:none;transition:.2s}
.composer textarea:focus{border-color:rgba(16,185,129,.55);box-shadow:0 0 0 3px rgba(16,185,129,.12)}
.btn{border:none;border-radius:11px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;white-space:nowrap}
.btn.primary{background:var(--grad);color:#04121b;box-shadow:0 4px 14px rgba(16,185,129,.3)}
.btn.primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;border:1px solid var(--bd2);color:var(--t2)}
.btn.ghost:hover{color:var(--t1);border-color:rgba(148,163,184,.4);background:var(--hover)}
.btn.warn{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:var(--yellow)}
.btn.warn:hover{background:rgba(251,191,36,.2)}
.btn.sm{padding:6px 13px;font-size:12.5px;border-radius:9px}
.quick{display:flex;gap:8px;padding:0 18px 10px;flex-wrap:wrap}

/* 娴嬭瘎杩涘害 */
.assess-progress{flex:1;min-width:0}
.ap-txt{font-size:12.5px;color:var(--t2);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.ap-txt b{color:var(--em)}
.ap-bar{height:7px;border-radius:7px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.ap-bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:7px;transition:width .5s ease}

/* 鎵撳瓧鍔ㄧ敾 */
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--t3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}

/* 鎶ュ憡 */
.report{background:var(--bg2);border:1px solid var(--bd2);border-radius:16px;padding:22px;margin:4px 18px 18px;animation:fadeUp .5s ease both}
.report h2{font-size:19px;margin-bottom:4px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.report .rp-sub{font-size:12px;color:var(--t3);margin-bottom:16px}
.rp-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.ring{position:relative;width:132px;height:132px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-txt b{font-size:30px;color:var(--t1)}
.ring .ring-txt span{font-size:11px;color:var(--t3)}
.rp-grade{font-size:15px}
.rp-grade .g-tag{display:inline-block;padding:3px 14px;border-radius:20px;font-weight:700;font-size:15px;margin-bottom:8px}
.g-ex{background:rgba(16,185,129,.15);color:var(--em);border:1px solid rgba(16,185,129,.4)}
.g-good{background:rgba(45,212,191,.13);color:var(--teal);border:1px solid rgba(45,212,191,.4)}
.g-mid{background:rgba(96,165,250,.13);color:var(--blue);border:1px solid rgba(96,165,250,.4)}
.g-pass{background:rgba(251,191,36,.13);color:var(--yellow);border:1px solid rgba(251,191,36,.4)}
.g-fail{background:rgba(248,113,113,.13);color:var(--red);border:1px solid rgba(248,113,113,.4)}
.rp-meta{font-size:12.5px;color:var(--t2);line-height:1.8}
.kp-row{margin:10px 0}
.kp-row .kp-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px}
.kp-row .kp-head b{color:var(--t1);font-weight:600}
.kp-row .kp-head .kp-val{color:var(--t2);white-space:nowrap}
.kp-bar{height:9px;border-radius:9px;background:var(--card);border:1px solid var(--bd);overflow:hidden}
.kp-bar i{display:block;height:100%;border-radius:9px;transition:width .8s ease}
.kp-comment{font-size:12px;color:var(--t3);margin-top:4px}
.rp-sec{margin-top:18px}
.rp-sec h3{font-size:14.5px;color:var(--teal);margin-bottom:8px}
.rp-sec ul{margin-left:18px;font-size:13px;color:var(--t2)}
.rp-sec li{margin:4px 0}
.rp-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px dashed var(--bd2)}

/* 渚ц竟鏍?*/
.col-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:82px}
.side-card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--shadow);animation:fadeUp .5s ease both}
.side-card h3{font-size:14px;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.side-card h3::before{content:"";width:4px;height:15px;border-radius:3px;background:var(--grad)}

  for (var attempt = 1; attempt <= 3; attempt++) {
    try {
      var ctrl = new AbortController();

      var body = {model: LLM.model, messages: messages, max_tokens: 800, temperature: 0.3};

      var resp = await fetch(LLM.endpoint, {

        body: JSON.stringify(body),

      clearTimeout(tm);

      if (!resp.ok) {
        var errTxt = '';

      }

      // #18: 鐪熸祦寮忚緭鍑?(SSE)
      if (useStream && streamCallback){
        var reader = resp.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '', fullText = '';
        while (true) {
          var _done, _value;
          try { var _r = await reader.read(); _done = _r.done; _value = _r.value; } catch(e) { break; }
          if (_done) break;
          buffer += decoder.decode(_value, {stream: true});
          var lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            if (line.indexOf('data: ') !== 0) continue;
            var sseData = line.slice(6).trim();
            if (sseData === '[DONE]') continue;
            try {
              var json = JSON.parse(sseData);
              var delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
              if (delta) { fullText += delta; streamCallback(delta, fullText); }
            } catch(e2) { /* skip malformed chunks */ }
          }
        }
        return fullText;
      }

      // 闈炴祦寮忔ā寮?
      var jdata = await resp.json();
      return jdata.choices[0].message.content;
    } catch(e) {
      // 鏈€鍚庝竴娆″け璐ュ垯鎶涘嚭

      var delayMs = Math.pow(2, attempt - 1) * 1000 * (0.8 + Math.random() * 0.4);

function extractTerms(q){
  const nq=norm(q),terms=new Set(),strong=new Set();
  const addS=t=>{t=norm(t);if(t&&t.length>=2){terms.add(t);strong.add(t);}};
  DOMAIN_TERMS.forEach(t=>{if(nq.includes(norm(t)))addS(t);});
  // 鍖栧瀹炰綋/鍚屼箟璇嶆墿灞曪細鍛戒腑涓€涓埆鍚?鈬?鍚岀粍鍏ㄩ儴鍒悕閮戒綔涓烘绱㈣瘝
  CHEM_DB.forEach(c=>{if(c.alias.some(a=>nq.includes(norm(a))))c.alias.forEach(a=>addS(a));});
  SYN_GROUPS.forEach(g=>{if(g.some(a=>nq.includes(norm(a))))g.forEach(a=>addS(a));});
  (q.toLowerCase().match(/[a-z0-9\[\]\(\)\+\-\.]{2,}/g)||[]).forEach(w=>{if(!STOP_TERMS.includes(w)){terms.add(w);if(/[a-z]/.test(w))strong.add(w);}});
  (q.match(/[\u4e00-\u9fa5]{2,}/g)||[]).forEach(run=>{
    if(run.length<=4 && !STOP_TERMS.includes(run)){terms.add(run);if(run.length>=3)strong.add(run);}
    for(let i=0;i<run.length-1;i++){const g=run.slice(i,i+2);if(!STOP_TERMS.includes(g))terms.add(g);}
    for(let i=0;i<run.length-2;i++){const g=run.slice(i,i+3);if(!STOP_TERMS.includes(g)){terms.add(g);strong.add(g);}}
  });
  const filt=a=>a.filter(t=>t&&t.length>=2&&!STOP_TERMS.includes(t));
  return {all:filt(Array.from(terms)),strong:new Set(filt(Array.from(strong)))};
}
function detectChems(q){const nq=norm(q);return CHEM_DB.filter(c=>c.alias.some(a=>nq.includes(norm(a))));}
function detectOps(q){const nq=norm(q);return OP_TERMS.filter(o=>nq.includes(norm(o)));}

function searchCorpus(q,topN){
  const {all,strong}=extractTerms(q);
  if(!all.length||!Corpus.entries.length) return {terms:all,results:[]};
  const nq=norm(q);
  const boosts=CONCEPT_BOOST.filter(b=>b.keys.some(k=>nq.includes(norm(k))));
  const out=[];
  for(const e of Corpus.entries){
    const f={
      title:norm(e.title),subfield:norm(e.subfield),objects:norm(e.objects),methods:norm(e.methods),
      questions:norm((e.questions||[]).join('|')),content:norm(e.content||''),abstract:norm(e.abstract||'')
    };
    let s=0,sh=false;const hit=new Set();
    for(const t of all){
      let w=0;
      if(f.questions.includes(t))w=Math.max(w,10);
      if(f.title.includes(t))w=Math.max(w,6);
      if(f.content&&f.content.includes(t))w=Math.max(w,6);
      if(f.objects.includes(t)||f.methods.includes(t))w=Math.max(w,4);
      if(f.abstract.includes(t))w=Math.max(w,4);
      if(f.subfield.includes(t))w=Math.max(w,3);
      if(w>0){s+=w;hit.add(t);if(strong.has(t))sh=true;}
    }
    for(const b of boosts){ if(f.subfield===norm(b.sub)){ s+=b.bonus; sh=true; hit.add('棰嗗煙:'+b.sub);} }
    if(s>0) out.push({e,score:s,hit:Array.from(hit),strongHit:sh});
  }
  out.sort((a,b)=>b.score-a.score);
  return {terms:all,results:out.slice(0,topN||6)};
}

function matchFAQ(q){
  var nq=norm(fixTypos(q));var best=null,bestScore=0;
  for(var i=0;i<FAQ.length;i++){
    var f=FAQ[i];
    var kh=0,longKey=0;
    for(var j=0;j<f.keys.length;j++){var k=f.keys[j];if(nq.indexOf(norm(k))>=0){kh++;if(norm(k).length>=3)longKey++;}}
    var eh=0;for(var ej=0;ej<(f.ents||[]).length;ej++){var en=f.ents[ej];if(nq.indexOf(norm(en))>=0)eh++;}
    var trig=(kh>=2)||(kh>=1&&eh>=1)||(eh>=2);
    if(!trig) continue;
    var score=kh*2+eh*3+longKey*0.5;
    if(score>=bestScore){bestScore=score;best=f;}
  }
  return best;
}

        for(var hi=0;hi<methodHits.length;hi++){if(methodHits[hi].e===e){already=true;break;}}
        if(!already){
          methodHits.push({e:e, score:6, hit:[op], strongHit:false, source:'method-transfer', method:op});
        }
      }
    }
  }
  methodHits.sort(function(a,b){return b.score-a.score;});
  return methodHits.slice(0,8);
}

/* ================= 鏅鸿兘浣撻泦缇ゆ祦姘寸嚎锛氱被姣旀帹鐞嗗紩鎿?================= */
function analogicalReasoning(q, directHits, analogyHits, methodHits){
  var nq=norm(q);
  var analogies=[];
  for(var ri=0;ri<ANALOG_TABLE.length;ri++){
    var row=ANALOG_TABLE[ri];
    for(var ai=0;ai<row.analogs.length;ai++){
      var a=row.analogs[ai];
      if(nq.indexOf(norm(a))>=0){
        var hasDirect=(directHits.length>=2);
        if(!hasDirect||directHits[0].score<HIT_THRESHOLD*2){
          analogies.push({
            matchedTerm: a,
            concept: row.concept,
            principle: row.generalPrinciple,
            hasDirect: hasDirect,
            strength: hasDirect?0.3:0.8
          });
        }
      }
    }
  }
  var seen={};
  var result=[];
  for(var i=0;i<analogies.length;i++){
    var a=analogies[i];
    var k=a.concept+a.matchedTerm;
    if(!seen[k]){seen[k]=true;result.push(a);}
  }
  return result;
}

function confidenceScore(directHits, analogyHits, methodHits, faq, analogies){
  var scores={};
  var maxDirectScore=0;
  for(var i=0;i<directHits.length;i++){maxDirectScore=Math.max(maxDirectScore,directHits[i].score);}
  scores.corpus=Math.min(1, maxDirectScore/60);
  scores.faq=faq?0.9:0;
  var analogyCount=analogies.length+analogyHits.length+methodHits.length;
  scores.analogy=Math.min(1, analogyCount*0.15);
  scores.overall=Math.max(scores.corpus, scores.faq, scores.analogy*0.6);
  scores.level=scores.overall>=0.7?'high':(scores.overall>=0.35?'medium':'low');
  return scores;
}

/* 鐩稿叧 FAQ 鎺ㄨ崘锛堢敤浜?鐭ヨ瘑寤朵几"杩介棶 chips锛?*/
function relatedFAQs(q,exclude,n){
  try {
    var nq=norm(q), scored=[];
    for(var i=0;i<FAQ.length;i++){
      var f=FAQ[i];
      if(f===exclude) continue;
      var s=0;
      for(var j=0;j<(f.ents||[]).length;j++){if(nq.indexOf(norm(f.ents[j]))>=0) s+=3;}
      if(exclude){for(var j2=0;j2<(f.ents||[]).length;j2++){if((exclude.ents||[]).indexOf(f.ents[j2])>=0) s+=2;}}
      for(var k=0;k<f.keys.length;k++){if(nq.indexOf(norm(f.keys[k]))>=0) s+=1;}
      if(s>0) scored.push({f:f,s:s});
    }
    scored.sort(function(a,b){return b.s-a.s;});
    var out=scored.slice(0,n||3).map(function(x){return x.f;});
    if(out.length<(n||3)){
      var FALLBACK=['瀹屾暣鎿嶄綔娴佺▼锛堝叚姝ヤ富绾匡級','瀹為獙鍘熺悊锛氫笁姝ュ弽搴旀柟绋嬪紡涓庢満鐞?,'瀹為獙鐜拌薄涓庣粓鐐瑰垽鏂?,'娓╁害鎺у埗瑕佺偣'];
      for(var t=0;t<FALLBACK.length;t++){
        if(out.length>=(n||3)) break;
        var found=FAQ.filter(function(x){return x.title===FALLBACK[t];})[0];
        if(found&&found!==exclude&&out.indexOf(found)<0) out.push(found);
      }
    }
    return out;
  } catch(e) { return []; }
}

function renderLatexBody(body, G){
  var s=body;
  s=s.replace(/\\\\/g,'\\');
  s=s.replace(/_\{([^{}]+)\}/g,'<sub class="ans-sub">$1</sub>');
  s=s.replace(/_([a-zA-Z0-9])/g,'<sub class="ans-sub">$1</sub>');
  s=s.replace(/\^\{([^{}]+)\}/g,'<sup class="ans-sup">$1</sup>');
  s=s.replace(/\^([a-zA-Z0-9\+\-])/g,'<sup class="ans-sup">$1</sup>');
  s=s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)');
  s=s.replace(/\\sqrt(?:\[([^\]]*)\])?\{([^{}]*)\}/g,'鈭?$2)');
  s=s.replace(/\\xrightarrow(?:\[[^\]]*\])?\{([^{}]*)\}/g,'鈫?$1)');
  s=s.replace(/\\bar\{([^{}]*)\}/g,'$1虅');
  s=s.replace(/\\hat\{([^{}]*)\}/g,'$1虃');
  var keys=Object.keys(G);
  for(var i=0;i<keys.length;i++){s=s.split(keys[i]).join(G[keys[i]]);}
  s=s.replace(/\\([a-zA-Z]+)/g,'$1');
  s=s.replace(/\\/g,'');
  s=s.replace(/[{}]/g,'');
  return s;
}

function renderRichAnswer(text){
  var raw=String(text==null?'':text).replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  if(!raw) return '';
  var rendered=renderLatexToUnicode(raw);
  var blocks=rendered.split(/\n{2,}/).map(function(b){return b.replace(/\n+/g,'\n').trim();}).filter(Boolean);
  if(!blocks.length) return '';
  return blocks.map(function(block){
    var lines=block.split('\n').map(function(l){return l.trim();}).filter(Boolean);
    if(!lines.length) return '';
    var isUl=lines.every(function(l){return /^[-*鈥\s+/.test(l);});
    var isOl=lines.every(function(l){return /^\d{1,2}[.銆?锛塢\s+/.test(l);});
    if(isUl||isOl){
      var tag=isUl?'ul':'ol';
      return '<'+tag+'>'+lines.map(function(line){
        var clean=line.replace(/^[-*鈥\s+/,'').replace(/^\d{1,2}[.銆?锛塢\s+/,'');
        return '<li>'+inlineRich(clean)+'</li>';
      }).join('')+'</'+tag+'>';
    }
    var html=lines.map(function(line){
      var heading=/^(?:銆恷#{1,4}\s)/.test(line)||/^\*\*[^*]+\*\*$/.test(line);
      var eq=/(?:鈫抾鈫恷鈬寍鉄秥鉄祙鈫搢鈫?/.test(line);
      var clean=line.replace(/^#{1,4}\s+/,'');
      var h=inlineRich(clean);
      return '<div class="'+(heading?'ans-head':(eq?'ans-eq':'ans-line'))+'">'+h+'</div>';
    }).join('');
    return '<p>'+html+'</p>';
  }).join('');
}

function inlineRich(line){
  var h=esc(line);
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  return h;
}

function buildReportData(){
  let total=0;KP.forEach((kp,i)=>{total+=kp.weight*(A.results[i].mastery||0);});

  const assessed=items.filter(x=>x.m!==null);
  const strengths=assessed.filter(x=>x.m>=0.8).sort((a,b)=>b.m-a.m);
  const weakness=assessed.filter(x=>x.m<0.6).sort((a,b)=>a.m-b.m);
  const unassessed=items.filter(x=>x.m===null);
  return{total,items,strengths,weakness,unassessed,rounds:A.round,date:new Date()};
}

$('#asSkip').addEventListener('click',()=>{
  if(A.finished||asBusy||!A.started)return;

});

$('#asFinish').addEventListener('click',()=>{
  if(A.finished)return;

  finishAssess(A.round<MIN_ROUND?'鎵嬪姩鎻愬墠缁撴潫锛堟湭婊?'+MIN_ROUND+' 杞紝鏈祴璇勭煡璇嗙偣鎸?0 璁★級':'鎵嬪姩缁撴潫娴嬭瘎');
});

/* ================= Tab 鍒囨崲涓庡垵濮嬪寲 ================= */
function switchTab(mode,push){
  const qa=mode!=='assess';
  $('#panel-qa').classList.toggle('hidden',!qa);
  $('#panel-assess').classList.toggle('hidden',qa);
  $$('.tab').forEach(t=>t.classList.toggle('on',(t.dataset.mode==='assess')!==qa));
  if(qa){setTimeout(()=>{scrollChat(qaChat);qaInput.focus();},50);}
  else{
    setTimeout(()=>{scrollChat(asChat);asInput.focus();},50);
    startAssess();
  }
  if(push!==false){
    try{history.replaceState(null,'','assistant.html?mode='+(qa?'qa':'assess'));}catch(e){}
  }
}
$$('.tab').forEach(t=>t.addEventListener('click',function(){switchTab(t.dataset.mode);}));
